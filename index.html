<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flourish — Legal</title>
<meta name="description" content="Privacy policy and support for the Flourish personal-finance app.">
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.card {
    display: block; text-decoration: none; color: var(--fg);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 12px;
  }
  a.card strong { color: var(--accent); display: block; font-size: 1.1rem; margin-bottom: 2px; }
  a.card span { color: var(--muted); font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <h1>Flourish</h1>
  <p>Legal &amp; support for the Flourish personal-finance app.</p>
  <a class="card" href="privacy-policy.html">
    <strong>Privacy Policy</strong>
    <span>What we collect, how it&rsquo;s protected, and your controls.</span>
  </a>
  <a class="card" href="support.html">
    <strong>Support</strong>
    <span>Get help, common questions, and how to contact us.</span>
  </a>
  <p style="margin-top:28px;color:var(--muted);font-size:0.92rem">
    <a href="https://sherpagroup.com.au" style="color:var(--accent)">sherpagroup.com.au</a>
  </p>
</main>
</body>
</html>
